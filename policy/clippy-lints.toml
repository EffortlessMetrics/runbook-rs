class = "taste"
reason = "Match on Result directly rather than converting to Option."

[[lint]]
name = "clippy::cloned_instead_of_copied"
level = "warn"
status = "active"
class = "taste"
reason = "Prefer copied for Copy values."

[[lint]]
name = "clippy::iter_cloned_collect"
level = "warn"
status = "active"
class = "taste"
reason = "Prefer to_vec or clearer collection helpers."

[[lint]]
name = "clippy::iter_overeager_cloned"
level = "warn"
status = "active"
class = "taste"
reason = "Clone as late as possible."

[[lint]]
name = "clippy::needless_collect"
level = "warn"
status = "active"
class = "taste"
reason = "Avoid intermediate allocations when iteration can stream."

[[lint]]
name = "clippy::redundant_closure"
level = "warn"
status = "active"
class = "taste"
reason = "Remove closure noise when a function item is enough."

[[lint]]
name = "clippy::redundant_closure_for_method_calls"
level = "warn"
status = "active"
class = "taste"
